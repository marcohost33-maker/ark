name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: ruff (DoD, full default rule set)
        run: ruff check .
      - name: compile
        run: python -m compileall -q TOOLS tests
      - name: freeze-manifest gate (ARK-NG-002, fail-closed)
        run: python TOOLS/freeze_manifest.py
      - name: pytest
        run: pytest -q
