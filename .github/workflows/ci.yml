name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest jsonschema scipy
      - name: ruff critical
        run: ruff check TOOLS tests --select=F,E9
      - name: compile
        run: python -m compileall -q TOOLS tests
      - name: freeze-manifest gate (ARK-NG-002, fail-closed)
        run: python TOOLS/freeze_manifest.py
      - name: pytest
        run: pytest -q
