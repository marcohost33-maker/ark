name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: ruff (DoD, full default rule set)
        run: ruff check .
      - name: compile
        run: python -m compileall -q TOOLS tests
      - name: freeze-manifest gate (ARK-NG-002, fail-closed)
        run: python TOOLS/freeze_manifest.py
      - name: pytest
        run: pytest -q
      - name: release SBOM path (ARK-R8-002, same script as release.yml)
        run: python TOOLS/release_sbom.py --out "$RUNNER_TEMP/sbom"
      - name: release bundle (ARK-R8-001, software subject; must equal the committed digest pin)
        run: python TOOLS/release_bundle.py --out "$RUNNER_TEMP/bundle"

  # ARK-R8-009: the determinism claims (verdict independent of the filesystem, LF bytes via
  # .gitattributes, freeze hashes) are exercised on the platforms consumers run, not only on
  # Linux. Separate job so the required `gate` check keeps its name; same hash-locked install.
  portability:
    name: portability (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
          - os: macos-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: install
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt
      - name: freeze-manifest gate (byte-identical checkout on every OS)
        run: python TOOLS/freeze_manifest.py
      - name: pytest
        run: pytest -q
      # Same pin on every OS: the release bundle is byte-identical across platforms.
      - name: release bundle (ARK-R8-001, must equal the committed digest pin)
        shell: bash
        run: python TOOLS/release_bundle.py --out "$RUNNER_TEMP/bundle"
