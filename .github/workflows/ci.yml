name: ci

on:
  push:
    branches: [main, ci-hard-gates]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.11"
      - name: install
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest jsonschema
      - name: ruff critical
        run: ruff check TOOLS tests --select=F,E9
      - name: compile
        run: python -m compileall -q TOOLS tests
      - name: pytest
        run: pytest -q
