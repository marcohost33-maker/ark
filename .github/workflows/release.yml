# Release hardening (issue #19, ARK-R8-001): software bundle + SBOM + build-provenance attestation on tag.
# Runs only for version tags, so it does not gate normal PRs. A manual dispatch is
# kept for re-running a tag, but the job is skipped on any non-tag ref, and the
# release gate refuses a non-tag ref as well (cross-family review ARK-P1-02):
# a branch run never builds, attests or uploads release artifacts.
# All actions are pinned to immutable commit SHAs (zizmor workflow-audit clean).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  provenance:
    name: bundle + sbom + attestation
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read source only; no release-asset writes here
      id-token: write        # required by attest-build-provenance (OIDC)
      attestations: write    # required to write the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Release gate (strict SemVer VERSION, tag ref only, tag == v<VERSION>)
        id: version
        # SPECS/VERSIONING_POLICY_v1.md: a release never attests a manifest of another
        # version. TOOLS/release_gate.py uses the same SemVer grammar as the version
        # tests (ark_semver.SEMVER_RE, full match) and reads only repo content and
        # GitHub's own ref env vars; no workflow expression is expanded into a script.
        run: python TOOLS/release_gate.py

      - name: Install pinned tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-ci.txt

      # Same gate as ci.yml on the tagged commit (ARK-R8-003): a tag pushed to a
      # commit that never ran ci.yml still cannot attest code that fails lint.
      - name: ruff (DoD, full default rule set)
        run: ruff check .

      - name: compile
        run: python -m compileall -q TOOLS tests

      - name: Test suite on the release commit (includes version + release-gate tests)
        run: pytest -q

      - name: Freeze-manifest gate (must be in sync at release)
        run: python TOOLS/freeze_manifest.py

      - name: Build release artifacts (software bundle, runtime + build SBOM, freeze manifest)
        env:
          ARK_VERSION: ${{ steps.version.outputs.version }}
        # TOOLS/release_sbom.py (ARK-R8-002): runtime SBOM from a clean venv holding only
        # requirements-runtime.txt, verified name==version against the pins (fail-closed),
        # plus a separately named SBOM of this build environment.
        # TOOLS/release_bundle.py (ARK-R8-001): the software subject. Canonical archive of
        # exactly the manifest-pinned files; refused unless its digest equals the pin
        # committed in this tagged source (artifacts/RELEASE_BUNDLE_v<VERSION>.sha256).
        # ci.yml runs both scripts on every PR, so this step is not first exercised by a tag.
        run: |
          python TOOLS/release_sbom.py --out dist
          python TOOLS/release_bundle.py --out dist
          cp "artifacts/FREEZE_MANIFEST_v${ARK_VERSION}.json" dist/
          cp "artifacts/RELEASE_BUNDLE_v${ARK_VERSION}.sha256" dist/
          cp VERSION dist/VERSION

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Upload release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ark-release-artifacts
          path: dist/
          if-no-files-found: error
