# Release hardening (issue #19): SBOM + build-provenance attestation on tag.
# Runs only on version tags / manual dispatch, so it does not gate normal PRs.
# All actions are pinned to immutable commit SHAs (zizmor workflow-audit clean).
name: release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  provenance:
    name: sbom + attestation
    runs-on: ubuntu-latest
    permissions:
      contents: read        # read source only; no release-asset writes here
      id-token: write        # required by attest-build-provenance (OIDC)
      attestations: write    # required to write the provenance attestation
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          persist-credentials: false

      - name: Resolve version and gate the tag (VERSION is the single source of truth)
        id: version
        # SPECS/VERSIONING_POLICY_v1.md: a release never attests a manifest of another
        # version. Only repo content and GitHub's own ref env vars are read; no
        # workflow expression is expanded into the script.
        run: |
          version="$(cat VERSION)"
          case "$version" in
            ""|*[!0-9A-Za-z.+-]*) echo "VERSION is malformed: '$version'" >&2; exit 1 ;;
          esac
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v${version}" ]; then
            echo "tag $GITHUB_REF_NAME does not match VERSION (expected v${version})" >&2
            exit 1
          fi
          if [ ! -f "artifacts/FREEZE_MANIFEST_v${version}.json" ]; then
            echo "no freeze manifest for VERSION ${version}" >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"

      - name: Install pinned tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install cyclonedx-bom==7.3.0

      - name: Freeze-manifest gate (must be in sync at release)
        run: python TOOLS/freeze_manifest.py

      - name: Build release artifacts (SBOM + freeze manifest)
        env:
          ARK_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cyclonedx-py environment --output-format JSON --outfile dist/sbom.cdx.json
          cp "artifacts/FREEZE_MANIFEST_v${ARK_VERSION}.json" dist/
          cp VERSION dist/VERSION

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: "dist/*"

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: ark-release-artifacts
          path: dist/
          if-no-files-found: error
