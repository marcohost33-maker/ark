# zizmor — static analysis for GitHub Actions workflows (Fleet-Standard, 2026-06-06)
# Docs: https://docs.zizmor.sh + https://github.com/zizmorcore/zizmor-action
# NOTE (2026-06-28): paths-Filter entfernt. "zizmor workflow audit" ist in dieser
# Repo-Branch-Protection ein REQUIRED check; mit paths-Filter lief er nur bei
# Workflow-Diffs -> jeder Nicht-Workflow-PR blieb dauerhaft BLOCKED. zizmor laeuft
# nun auf jedem PR (billig, ~20s) und liefert den Required-Context immer.
name: Workflow Security Audit (zizmor)

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "13 6 * * 1"   # Mondays 06:13 UTC

permissions: {}

jobs:
  zizmor:
    name: zizmor workflow audit
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
        with:
          persist-credentials: false

      - name: Run zizmor
        # zizmor exits non-zero bei Findings -> dieser Step GATET die CI.
        env:
          # GH_TOKEN gegen unauthentifizierte Rate-Limits der Online-Audits.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        uses: zizmorcore/zizmor-action@5f14fd08f7cf1cb1609c1e344975f152c7ee938d  # v0.5.6
        with:
          persona: regular
          # privates Repo ohne GHAS: kein Code-Scanning-Upload, Findings als Annotationen.
          advanced-security: false
          annotations: true
